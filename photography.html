<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Priyanshu Sagar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #e8ff47;
    --accent2: #47ffe8;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --card: #13131c;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
  }

  /* Cursor */
  .cursor {
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none;
    z-index: 9998;
    transition: all 0.3s ease;
    opacity: 0.5;
  }

  /* Noise */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.3;
  }

  /* Grid bg */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none; z-index: 0;
  }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 4rem;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .nav-back {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    display: flex; align-items: center; gap: 0.6rem;
    transition: color 0.2s;
    cursor: none;
  }
  .nav-back:hover { color: var(--accent); }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--accent);
  }

  .nav-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: right;
  }

  /* Hero */
  .photo-hero {
    position: relative; z-index: 1;
    padding: 10rem 4rem 5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.75rem;
    animation: fadeUp 0.5s ease 0.2s both;
  }
  .hero-eyebrow::before {
    content: '';
    width: 32px; height: 1px;
    background: var(--accent);
    display: inline-block;
  }

  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(3.5rem, 9vw, 8rem);
    line-height: 0.9;
    letter-spacing: -0.03em;
    animation: fadeUp 0.5s ease 0.3s both;
  }

  .hero-title span {
    display: block;
    color: transparent;
    -webkit-text-stroke: 1px rgba(232,255,71,0.4);
    font-style: italic;
  }

  .hero-desc {
    font-size: 1rem;
    color: var(--muted);
    max-width: 360px;
    line-height: 1.7;
    border-left: 1px solid var(--border);
    padding-left: 1.5rem;
    animation: fadeUp 0.5s ease 0.5s both;
  }

  /* Filter bar */
  .filter-bar {
    position: relative; z-index: 1;
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    padding: 2rem 4rem;
    border-bottom: 1px solid var(--border);
    animation: fadeUp 0.5s ease 0.6s both;
  }

  .filter-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.4rem 1rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: none;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,255,71,0.05);
  }

  /* Count bar */
  .count-bar {
    position: relative; z-index: 1;
    padding: 1rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .count-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .count-text span { color: var(--accent); }

  /* Gallery */
  .gallery-container {
    position: relative; z-index: 1;
    padding: 3px 3px 6rem;
  }

  .gallery-grid {
    columns: 3;
    column-gap: 3px;
  }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: 3px;
    position: relative;
    overflow: hidden;
    cursor: none;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  .gallery-item.visible {
    opacity: 1;
    transform: none;
  }

  .gallery-item.hidden { display: none; }

  .gallery-item img {
    width: 100%;
    display: block;
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    filter: saturate(0.8) brightness(0.95);
  }

  .gallery-item:hover img {
    transform: scale(1.04);
    filter: saturate(1) brightness(1);
  }

  .gallery-item-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,10,15,0.88) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.35s;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1.4rem;
  }

  .gallery-item:hover .gallery-item-overlay { opacity: 1; }

  .item-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    color: #fff;
    margin-bottom: 0.25rem;
    line-height: 1.2;
  }

  .item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10,10,15,0.97);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
  }
  .lightbox.open {
    display: flex;
    animation: fadeIn 0.25s ease;
  }

  .lightbox-inner {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    max-width: 92vw;
    max-height: 92vh;
  }

  .lightbox-img {
    max-width: 88vw;
    max-height: 80vh;
    object-fit: contain;
    box-shadow: 0 0 100px rgba(0,0,0,0.9);
    transition: opacity 0.2s;
  }

  .lightbox-meta {
    display: flex; align-items: center; gap: 2rem;
  }

  .lb-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
  }

  .lb-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .lb-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
  }

  .lightbox-close {
    position: absolute;
    top: -2.8rem; right: 0;
    background: none; border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: none;
    transition: color 0.2s;
  }
  .lightbox-close:hover { color: var(--accent); }

  .lightbox-nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    background: rgba(10,10,15,0.7);
    border: 1px solid var(--border);
    color: var(--text);
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    cursor: none;
    transition: all 0.2s;
  }
  .lightbox-nav:hover { border-color: var(--accent); color: var(--accent); }
  .lightbox-prev { right: calc(100% + 1.5rem); }
  .lightbox-next { left:  calc(100% + 1.5rem); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 900px) {
    nav, .photo-hero, .filter-bar, .count-bar { padding-left: 2rem; padding-right: 2rem; }
    .photo-hero { padding-top: 8rem; }
    .gallery-grid { columns: 2; }
    .lightbox-prev { right: auto; left: 0.5rem; }
    .lightbox-next { left: auto; right: 0.5rem; }
  }
  @media (max-width: 560px) {
    .gallery-grid { columns: 1; }
    .nav-tag { display: none; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lbClose">✕ Close</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
    <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
    <img class="lightbox-img" id="lbImg" src="" alt="">
    <div class="lightbox-meta">
      <div class="lb-title"  id="lbTitle"></div>
      <div class="lb-tag"    id="lbTag"></div>
      <div class="lb-counter" id="lbCounter"></div>
    </div>
  </div>
</div>

<nav>
  <a href="priyanshu_portfolio.html" class="nav-back">← Portfolio</a>
  <div class="nav-logo">PS.</div>
  <div class="nav-tag">Visual Journal</div>
</nav>

<div class="photo-hero">
  <div>
    <div class="hero-eyebrow">Visual Journal</div>
    <h1 class="hero-title">Through the<span>Lens.</span></h1>
  </div>
  <p class="hero-desc">
    Moments worth pausing for — light, geometry, and the quiet poetry of everyday scenes captured one frame at a time.
  </p>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="fauna">Fauna</button>
  <button class="filter-btn" data-filter="flora">Flora</button>
  <button class="filter-btn" data-filter="verdant">Verdant</button>
  <button class="filter-btn" data-filter="macro">Macro</button>
  <button class="filter-btn" data-filter="architecture">Architecture</button>
  <button class="filter-btn" data-filter="night">Night</button>
  <button class="filter-btn" data-filter="travel">Travel</button>
  <button class="filter-btn" data-filter="abstract">Abstract</button>
</div>

<div class="count-bar">
  <div class="count-text"><span id="visibleCount">0</span> photos</div>
  <div class="count-text" style="opacity:0.45;">Click any photo to expand · Arrow keys to navigate</div>
</div>

<div class="gallery-container">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<script>
  // ================================================================
  //  YOUR PHOTOS — edit this array when you're ready to add images
  //
  //  src      : path relative to this HTML file
  //             e.g. "photos/golden-hour.jpg"
  //             Keep all your images in a folder called "photos/"
  //             sitting next to this HTML file.
  //
  //  title    : caption shown on hover and in the lightbox
  //
  //  category : landscape | street | portrait | macro |
  //             architecture | night | travel | abstract
  // ================================================================
  const photos = [

    {src: "photos/fauna/flex.jpg", title: "Flexing", category: "fauna"},
    {src: "photos/flora/sunset.jpg", title: "Sunset", category: "flora"},
    {src: "photos/fauna/cuddle.jpg", title: "Cuddles", category: "fauna"},
    {src: "photos/verdant/green.jpg", title: "Greenery", category: "verdant"},
    {src: "photos/fauna/shy.jpg", title: "Shai Hulud", category: "fauna"},
    {src: "photos/fauna/sneaky.jpg", title: "Sneaky", category: "fauna"},
    {src: "photos/fauna/sleepy.jpg", title: "Sleeping Beauty", category: "fauna"},
    {src: "photos/fauna/stretch.jpg", title: "Stretch", category: "fauna"},
    {src: "photos/flora/heavenly.jpg", title: "Heavenly", category: "flora"},
    {src: "photos/flora/cloudy.jpg", title: "Cloudy", category: "flora"},
    {src: "photos/night/candle.jpg", title: "Whispers in the Dark", category: "night"},
    
    
    // ── Paste your entries here, one per photo ──────────────────
    // { src: "photos/golden-hour.jpg",    title: "Golden Hour",           category: "landscape"    },
    // { src: "photos/old-bazaar.jpg",     title: "Old Bazaar",            category: "street"       },
    // { src: "photos/monsoon-roof.jpg",   title: "Monsoon on the Roof",   category: "abstract"     },
    // { src: "photos/steel-city.jpg",     title: "Steel City at Dawn",    category: "architecture" },
    // { src: "photos/milky-way.jpg",      title: "Milky Way, Vellore",    category: "night"        },
    // ───────────────────────────────────────────────────────────

  ];
  // ================================================================

  let currentFilter = 'all';
  let lbIndex = 0;
  let lbList  = [];

  // ── Build gallery ─────────────────────────────────────────────
  function render() {
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';

    lbList = currentFilter === 'all'
      ? photos
      : photos.filter(p => p.category === currentFilter);

    document.getElementById('visibleCount').textContent = lbList.length;

    lbList.forEach((photo, idx) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `
        <img src="${photo.src}" alt="${photo.title}" loading="lazy">
        <div class="gallery-item-overlay">
          <div class="item-title">${photo.title}</div>
          <div class="item-meta">${photo.category}</div>
        </div>
      `;
      item.addEventListener('click', () => openLightbox(idx));
      grid.appendChild(item);
      requestAnimationFrame(() =>
        setTimeout(() => item.classList.add('visible'), idx * 55)
      );
    });
  }

  // ── Lightbox ──────────────────────────────────────────────────
  function openLightbox(idx) {
    lbIndex = idx;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
  }

  function updateLightbox() {
    const p   = lbList[lbIndex];
    const img = document.getElementById('lbImg');
    img.style.opacity = '0';
    img.src = p.src;
    img.onload = () => { img.style.opacity = '1'; };
    document.getElementById('lbTitle').textContent   = p.title;
    document.getElementById('lbTag').textContent     = p.category;
    document.getElementById('lbCounter').textContent = `${lbIndex + 1} / ${lbList.length}`;
  }

  document.getElementById('lbClose').addEventListener('click', () =>
    document.getElementById('lightbox').classList.remove('open'));

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox'))
      document.getElementById('lightbox').classList.remove('open');
  });

  document.getElementById('lbPrev').addEventListener('click', () => {
    lbIndex = (lbIndex - 1 + lbList.length) % lbList.length;
    updateLightbox();
  });

  document.getElementById('lbNext').addEventListener('click', () => {
    lbIndex = (lbIndex + 1) % lbList.length;
    updateLightbox();
  });

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')      document.getElementById('lightbox').classList.remove('open');
    if (e.key === 'ArrowLeft')  { lbIndex = (lbIndex - 1 + lbList.length) % lbList.length; updateLightbox(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % lbList.length; updateLightbox(); }
  });

  // ── Filters ───────────────────────────────────────────────────
  document.getElementById('filterBar').addEventListener('click', e => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    render();
  });

  // ── Cursor ────────────────────────────────────────────────────
  const cur  = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cur.style.transform = `translate(${mx - 6}px, ${my - 6}px)`;
  });

  (function loop() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    ring.style.transform = `translate(${rx - 18}px, ${ry - 18}px)`;
    requestAnimationFrame(loop);
  })();

  // ── Init ──────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
